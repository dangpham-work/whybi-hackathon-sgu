[project]
name = "whybi-backend"
version = "0.1.0"
description = "Whybi AI – backend FastAPI (Sinh viên làm thầy, AI làm học trò)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "celery[redis]>=5.4",
  "networkx>=3.4",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
  "minio>=7.2",
  "pymupdf>=1.25",
  "python-docx>=1.1",
  "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]  # migration tự sinh

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() trong tham số mặc định

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: cần Postgres/Redis thật (chạy trong docker compose hoặc CI)",
]

[tool.uv]
package = false
