# CI – chạy ở mọi PR và push lên main (C2-01, KT-03). Nhánh main được bảo vệ: bắt buộc PR + CI xanh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whybi
          POSTGRES_PASSWORD: whybi
          POSTGRES_DB: whybi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whybi" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      LLM_MODE: fake
      DATABASE_URL: postgresql+psycopg://whybi:whybi@localhost:5432/whybi
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migration chạy sạch + khớp models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # KT-03: dựng cả stack docker compose (LLM_MODE=fake) → test tích hợp (pytest + httpx) + E2E Playwright.
  # Chạy song song với các job khác (không `needs`). Tạm `continue-on-error` để stack chậm / lỗi không chặn PR;
  # bỏ dòng này và thêm vào required checks khi stack đã ổn định.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      RUN_INTEGRATION: "1"
      INTEGRATION_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v5
      - name: Dựng stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 600
      - name: Health qua nginx
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost/health
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Test tích hợp (pytest -m integration)
        working-directory: backend
        run: uv sync --frozen && uv run pytest -q -m integration
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: E2E Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Log stack khi lỗi
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail 200
      - name: Dọn stack
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
