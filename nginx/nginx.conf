# Nginx – reverse proxy, phục vụ SPA, nâng cấp WebSocket (Bảng 5.15). Chủ: Long (C2-03, C2-04).
# TLS (NFR-07): bản dev này chỉ nghe cổng 80. Trên VM demo dùng nginx.tls.conf qua docker-compose.tls.yml
# (bản sao của file này + 443 + chuyển hướng 80 → 443): đổi location ở đây thì đổi cả bên đó.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # giáo trình ≤ 20 MB (FR-SK-02) + ghi âm

    # Docker internal DNS resolver để tự động cập nhật IP khi container api được tạo lại (#160)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi đường dẫn khác trả index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
