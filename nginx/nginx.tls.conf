# Nginx có HTTPS cho VM demo (C2-04, NFR-07). Chủ: Long.
# Nạp qua docker-compose.tls.yml: file này là *template* – ${DOMAIN} được thay lúc container khởi động.
# Bản sao của nginx.conf (dev, cổng 80): đổi location ở đây thì đổi cả bên đó.
# ponytail: sao chép thay vì include chung – thêm file .inc khi location còn đổi nhiều.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cổng 80: chỉ giữ /health (healthcheck, deploy) còn lại chuyển sang HTTPS.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /health {
        proxy_pass $api_upstream/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    client_max_body_size 25m;   # giáo trình ≤ 20 MB (FR-SK-02) + ghi âm

    # Docker internal DNS resolver để tự động cập nhật IP khi container api được tạo lại (#160)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi đường dẫn khác trả index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
